# SkepiFB shop configuration file
#
# Defines every cosmetic shop GUI (block shop, tools, reset animation, firework
# color, practice blocks, rankups, island shop, tags). All values below are
# live-editable - run /fb reload after saving changes and every open shop menu
# updates immediately, no restart needed.
#
# Structure: shops -> <shop_id> -> categories -> <category_key> -> items -> <item_key>
#   title      - inventory title for this shop (supports & color codes)
#   size       - inventory size, must be a multiple of 9 (block shop/practice/island: 54, most others: 27)
#   page-size  - (block shop only) items per page before the category selector pages
#   category-selector - (block shop only) the category-picker screen; each entry needs
#                        slot, item (a Material) and name
#   categories - one entry per category; each category has a title and an items map
#
# Each item under "items" supports:
#   material - the Bukkit Material purchased/equipped (must be a valid full block for
#              block/practice shops - avoid anything with gravity, slowness, or damage
#              side effects, since players build and stand on these)
#   name     - display name shown in the shop (supports & color codes)
#   price    - cost in coins to purchase (equipping is free once owned)
#   slot     - fixed slot override; most categories auto-place items in reading order,
#              so 99 (meaning "auto") is the normal value here - only change this if you
#              need to pin a specific item to a specific slot
#   lore     - list of description lines shown on hover (supports & color codes)
#   default  - true marks this item as the shop's fallback/starting item, used whenever
#              a player has nothing equipped for this shop; at most one per shop
#
